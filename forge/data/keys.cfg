# Chosen Forge's keys: action = key (UDB's action names, and UDB's default keys where it has the action).
# Preferences > Keys overrides them in forge.cfg (keys.<action>).
# Modifiers: Ctrl, Shift, Alt; key names as Godot spells them (A, F9, Insert, Delete, BracketLeft, Tab, KpAdd...).
# Mouse (UDB's): left selects (drag: a rectangle, or moves what it grabbed), right edits (drag: moves; on empty space:
# draws lines, or places a sprite in Sprites mode), wheel zooms, Space held (or the middle button) pans, Space tapped: the context menu.
newmap = Ctrl+N
openmap = Ctrl+O
savemap = Ctrl+S
savemapas = Ctrl+Shift+S
mapoptions = F2
preferences = F5
testmap = F9
showerrors = F11
# Help > Report a Problem, with a screenshot of the window and the camera (not PrtScr: Windows 11 opens its
# Snipping Tool on that; Print works where it doesn't)
reportproblem = F12
# Tools > Sounds: Blood's sounds to listen to (a sound field's Pick... picks one)
soundbrowser =
# Tools > Generate Lights: the lights Blood's sprites give, by the game's rules, as the map's own
generatelights =
# the game's guesses (fog, weather by episode, ground mist over the open ground) made the map's own atmospheres
generateatmosphere =
undo = Ctrl+Z
redo = Ctrl+Y
cutselection = Ctrl+X
copyselection = Ctrl+C
pasteselection = Ctrl+V
selectall = Ctrl+A
clearselection = C
# the selection (or what the mouse is on) turned about its middle by the mouse: sectors with their sprites, sprites' angles
rotateselection = R
# the selection (or what the mouse is on) moved by the mouse; X / Y lock it to the grid's axes, click keeps, right click puts back
moveselection = G
# the selection scaled by a box's handles (a corner: evenly, a side: across)
scaleselection = Shift+S
cancelmode = Escape
verticesmode = V
linedefsmode = L
sectorsmode = S
thingsmode = T
# Lights mode: the map's dynamic lights (a .MAPX keeps them)
lightsmode = K
# Atmosphere mode: the sectors' fog, ground mist, weather and wind (a .MAPX keeps them)
atmospheremode = M
drawlinesmode = Ctrl+D
drawrectanglemode = Ctrl+Shift+D
# a circle (an ellipse) in a box; a box cut into columns and rows of sectors
drawcirclemode =
drawgridmode =
# the grid moved to a vertex or turned along a wall (empty space: back)
aligngridmode =
insertitem = Insert
deleteitem = Delete
dissolveitem = Backspace
joinsectors = J
mergesectors = Shift+J
togglegrid = Alt+G
togglesnap = Alt+S
griddec = BracketLeft
gridinc = BracketRight
zoomin = Kp Add
zoomout = Kp Subtract
zoomtofit = Home
centerinscreen = Ctrl+Home
gotocoords = Ctrl+Shift+G
toggleinfopanel = QuoteLeft
cycleoverlap = Tab
copyproperties = Ctrl+Shift+C
pasteproperties = Ctrl+Alt+V
thinglookatcursor = Shift+L
visualmode = Q
# the 2D view modes and sprites as pictures (UDB has no keys for them: bind them in Preferences > Keys)
viewmodenormal =
viewmodebrightness =
viewmodefloors =
viewmodeceilings =
nextviewmode =
previousviewmode =
spritepictures =
showalllinks =
syncselection =
showinvisible =
# View > Full Brightness: the lighting left out, 2D and 3D (UDB's Toggle Full Brightness, its key)
togglebrightness = B
# View > Dynamic Lights (3D), Dynamic Light Shadows (3D)
showlights3d =
showatmosphere3d =
lightshadows =
linkchains =
showsectoreffects =
showsectoreffects3d =
# the context menu: Space tapped (held: pans), in the 2D view and the 3D preview; a key here as well
contextmenu =
showedit =
showoff = F3
showon = F4
playmovers = P
setfirstwall = Shift+F
# the selection's points (a wall's ends, a sector's corners) and sprites to the nearest grid crossing (UDB's)
snaptogrid = Shift+G
# the 3D preview's texture keys (UDB's visual mode; "visual..." keys count there only, before the others on the same
# key). Built in there too: the arrows move the texture (Shift 8, Ctrl the grid), keypad 6 / 4 and 8 / 5 the X and Y
# repeats (9 / 7 both; Shift or Ctrl 8), keypad + / - the shade.
visualautoalign = Ctrl+A
visualautoalignx = Alt+A
visualautoaligny = Alt+Shift+A
visualresettexture = Shift+R
visualcopyoffsets = Shift+C
visualpasteoffsets = Shift+V
visualflip = F
visualalignbottom = O
visualtexturesettings = T
# a sprite of the Sprites tab's type at the crosshair: on a floor, under a ceiling, flat on a wall (a decal)
visualinsert = I
# Play: what the crosshair is on used as the player uses it (a door, a switch)
visualuse = E
# Play in the 2D view: what the mouse is on used (a sector nothing pushes but entering sets off: entered)
playuse = E
# the selected sprites (else the one aimed at) deleted
visualdelete = Delete
# slope edges on / off: aimed at a floor or ceiling, the wheel raises or lowers its edge nearest the crosshair (the far
# corner kept: the plane tilts)
visualslopeedges = H
# Lights mode on and off without leaving the 3D preview (the lights' bulbs picked, held, placed with I; again: back to
# the mode before)
visuallightsmode = K
